name: CI Build

# 触发时机：main分支 推送代码 / 提交PR 时自动运行
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 运行环境
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取当前仓库代码到运行环境
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 如果你是Java项目：配置JDK
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # 3. Maven打包（SpringBoot项目直接用）
    - name: Build with Maven
      run: mvn clean package -DskipTests
